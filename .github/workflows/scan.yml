name: APIsec Surface org scan

# Reusable workflow. Customers call it from a short workflow in their org
# (templates/apisec-scan.yml); it runs there, on their runners, with their
# secrets and variables. Only Surface analysis results leave the org.
#
# Secrets (passed by name; `secrets: inherit` does not cross orgs):
#   APISEC_TOKEN    APIsec personal access token. Required unless dry_run.
#   ORG_READ_TOKEN  Fine-grained PAT with Contents: read and Metadata: read on
#                   the repos to scan. Without it only public repos are visible.
#
# Org variables:
#   APISEC_ENDPOINT        APIsec API URL. Required.
#   THROUGHPUT             Max parallel scans, 1-10. Default 2.
#   ORCHESTRATOR_RUNNER    github-hosted (default) | self-hosted.
#   APISEC_RUN_PROFILE     surface (default) | legacy.
#   TARGET_ORG             Scan another org than the caller's.
#   EXCLUDE_REPOS          Comma-separated owner/repo names to skip.
#   APISEC_LLM_ENRICHMENT  0 to keep source snippets out of LLM gap-filling.
#   APISEC_CLI_VERSION     Override the pinned Surface CLI version.

on:
  workflow_call:
    inputs:
      dry_run:
        type: boolean
        default: false
      force_full_scan:
        type: boolean
        default: false
      max_repos:
        type: number
        default: 0
      throughput:
        type: number
        default: 0
      runner:
        type: string
        default: ''
      run_profile:
        type: string
        default: ''
    secrets:
      APISEC_TOKEN:
        required: false
      ORG_READ_TOKEN:
        required: false

env:
  ORGSCAN_SPEC: apisec-orgscan==1.0.0

jobs:
  plan:
    name: Plan
    runs-on: ${{ (inputs.runner || vars.ORCHESTRATOR_RUNNER) == 'self-hosted' && fromJSON('["self-hosted","apisec"]') || 'ubuntu-latest' }}
    timeout-minutes: 20
    outputs:
      count: ${{ steps.plan.outputs.count }}
      matrix: ${{ steps.plan.outputs.matrix }}
      run_profile: ${{ steps.plan.outputs.run_profile }}
      cli_version: ${{ steps.plan.outputs.cli_version }}
      throughput: ${{ steps.plan.outputs.throughput }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet "$ORGSCAN_SPEC"
      - id: plan
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ORG_READ_TOKEN: ${{ secrets.ORG_READ_TOKEN }}
          TARGET_ORG: ${{ vars.TARGET_ORG || github.repository_owner }}
          EXCLUDE_REPOS: ${{ vars.EXCLUDE_REPOS }}
          FORCE_FULL_SCAN: ${{ inputs.force_full_scan }}
          MAX_REPOS: ${{ inputs.max_repos }}
          IN_THROUGHPUT: ${{ inputs.throughput }}
          THROUGHPUT: ${{ vars.THROUGHPUT }}
          IN_RUN_PROFILE: ${{ inputs.run_profile }}
          APISEC_RUN_PROFILE: ${{ vars.APISEC_RUN_PROFILE }}
          APISEC_CLI_VERSION: ${{ vars.APISEC_CLI_VERSION }}
        run: apisec-orgscan plan

  scan:
    name: Scan ${{ matrix.repo_name }}
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ${{ (inputs.runner || vars.ORCHESTRATOR_RUNNER) == 'self-hosted' && fromJSON('["self-hosted","apisec"]') || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
      max-parallel: ${{ fromJSON(needs.plan.outputs.throughput) }}
      fail-fast: false
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        env:
          CLI_VERSION: ${{ needs.plan.outputs.cli_version }}
        run: |
          pip install --quiet "$ORGSCAN_SPEC" "apisec-surface==$CLI_VERSION"
          apisec-surface telemetry off || true
      - uses: actions/checkout@v4
        with:
          repository: ${{ matrix.repo_full_name }}
          token: ${{ secrets.ORG_READ_TOKEN || github.token }}
          path: repos/${{ matrix.repo_name }}
          fetch-depth: 1
      - name: Analyze
        env:
          REPO_NAME: ${{ matrix.repo_name }}
          REPO_ID: ${{ matrix.repo_id }}
          APISEC_PAT: ${{ secrets.APISEC_TOKEN }}
          APISEC_ENDPOINT: ${{ vars.APISEC_ENDPOINT }}
          APISEC_LLM_ENRICHMENT: ${{ vars.APISEC_LLM_ENRICHMENT }}
          RUN_PROFILE: ${{ needs.plan.outputs.run_profile }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: apisec-orgscan scan "repos/$REPO_NAME" --repo-id "$REPO_ID"
      - name: Record
        if: ${{ !inputs.dry_run }}
        env:
          REPO_ID: ${{ matrix.repo_id }}
          PUSHED_AT: ${{ matrix.pushed_at }}
        run: apisec-orgscan record --repo-id "$REPO_ID" --pushed-at "$PUSHED_AT"
      - if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: ts-update-${{ matrix.repo_id }}
          path: ts-updates/${{ matrix.repo_id }}.json
          retention-days: 1

  update-store:
    name: Update store
    needs: [plan, scan]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.count != '0'
    runs-on: ${{ (inputs.runner || vars.ORCHESTRATOR_RUNNER) == 'self-hosted' && fromJSON('["self-hosted","apisec"]') || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install --quiet "$ORGSCAN_SPEC"
      - uses: actions/download-artifact@v4
        with:
          pattern: ts-update-*
          path: ts-updates
          merge-multiple: true
        continue-on-error: true
      - env:
          GITHUB_TOKEN: ${{ github.token }}
        run: apisec-orgscan merge
      - uses: actions/upload-artifact@v4
        with:
          name: push-ts-store
          path: .cache/push-ts-store.json
          retention-days: 90
          overwrite: true
