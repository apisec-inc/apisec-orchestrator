name: Release

# Push tag vX.Y.Z (matching __version__) to publish apisec-orgscan to PyPI and
# move the vX major tag that customers' workflows call. Pre-release tags
# (vX.Y.ZrcN) publish without moving the major tag, for testing.

on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']

jobs:
  release:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check tag matches version
        run: |
          version=$(python -c "import re,pathlib;print(re.search(r'__version__ = \"(.+)\"',pathlib.Path('src/apisec_orgscan/__init__.py').read_text()).group(1))")
          [ "v$version" = "$GITHUB_REF_NAME" ] || { echo "::error::tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: pip install --quiet -e ".[dev]" build
      - run: pytest -q
      - run: python scripts/sync_templates.py --check
      - run: python -m build
      - uses: pypa/gh-action-pypi-publish@release/v1
      - name: Move major tag
        if: ${{ !contains(github.ref_name, 'rc') }}
        run: |
          major="${GITHUB_REF_NAME%%.*}"
          git tag -f "$major"
          git push -f origin "refs/tags/$major"
